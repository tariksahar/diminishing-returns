# Theme for the show-lookup app (app/streamlit_app.py): a two-colour riso print,
# on pale paper in light mode and on black stock in dark mode. The app's own
# markup carries the rest of the look; its colours live in app/riso.py and
# must stay in step with the two palettes below.
#
# No `base` is set on purpose. With both [theme.light] and [theme.dark]
# defined, Streamlit follows the visitor's system setting; a `base` would pin
# every visitor to one of them.

[theme]
showWidgetBorder = true
baseRadius = "none"
buttonRadius = "none"
font = "Newsreader:https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap, serif"
headingFont = "Anybody:https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&display=swap, sans-serif"
codeFont = "Azeret Mono:https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;600&display=swap, monospace"

[theme.light]
primaryColor = "#23212B"
backgroundColor = "#E9E8E2"
secondaryBackgroundColor = "#DEDCD3"
textColor = "#23212B"
borderColor = "#23212B"

[theme.dark]
primaryColor = "#ECE7DA"
backgroundColor = "#18171C"
secondaryBackgroundColor = "#24222A"
textColor = "#ECE7DA"
borderColor = "#ECE7DA"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
