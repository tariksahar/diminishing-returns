# The published numbers, re-checked on every push.
#
# The suite recomputes the headline figures from `data/processed/`, which is
# committed, so this needs no IMDb download and no secrets — a fresh clone is
# enough. That is the whole reason it can run here at all.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the version the analysis was run and the numbers published on.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        # matplotlib has no display on a runner; be explicit rather than relying
        # on its fallback.
        env:
          MPLBACKEND: Agg
        run: pytest -q
